<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Contact Form</title>

    <link rel="stylesheet" href="style.css">
    
</head>
<body>

<div class="container">

<header>
    <h1>My Portfolio</h1>
</header>

<main>
    <section>

    <h2>Contact Us</h2>

    <form>

        <label for="name">Full Name</label><br>
        <input
            type="text"
            id="name"
            name="name"
            placeholder="Enter your name"
            required
        >

        <br><br>

        <label for="email">Email</label><br>
        <input
            type="email"
            id="email"
            name="email"
            placeholder="Enter your email"
            required
        >

        <br><br>

        <label for="phone">Phone</label><br>
        <input
            type="tel"
            id="phone"
            name="phone"
            placeholder="09xxxxxxxx"
        >

        <br><br>

        <label for="message">Message</label><br>

        <textarea
            id="message"
            rows="6"
            cols="40"
            placeholder="Write your message..."
            required
        ></textarea>

        <br><br>

        <button type="submit">
            Send Message
        </button>

    </form>

    </section>

</main>

<footer>
    <p>© 2026 Bereket Elias. All Rights Reserved.</p>
</footer>

</div>

</body>
</html>
