<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox Mini Project</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Our Products</h1>

    <div class="container">

        <div class="card">
            <img src="https://b2c-contenthub.com/wp-content/uploads/2023/07/Acer_Aspire3.jpg?quality=50&strip=all" alt="Laptop">

            <p>$800</p>
            <button>Buy Now</button>
        </div>

        <div class="card">
            <img src="https://vader-prod.s3.amazonaws.com/1738252498-samsung-galaxy-z-fold-6-006-679ba0c7c43be.jpg" alt="Phone">
            <h2>Smartphone</h2>
            <p>$500</p>
            <button>Buy Now</button>
        </div>

        <div class="card">
            <img src="https://m.media-amazon.com/images/I/71fdhtv7fZL._AC_SL1500_.jpg" alt="Headphones">

            <p>$100</p>
            <button>Buy Now</button>
